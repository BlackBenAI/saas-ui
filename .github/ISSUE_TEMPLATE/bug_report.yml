name: Bug report
description: Report a reproducible editor, persistence, export, or accessibility bug.
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the bug and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /dashboard
        2. Edit ...
        3. Reload ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran `npm run typecheck`, `npm run lint`, `npm run test -- --run`, and `npm run build`.
        - label: This is not a security vulnerability (those go to security@blackbenai.bj).
